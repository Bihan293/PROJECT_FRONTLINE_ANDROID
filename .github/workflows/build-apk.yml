name: Build Android APK and Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/PROJECT_FRONTLINE_v0.3.0.apk
          cp release-artifacts/PROJECT_FRONTLINE_v0.3.0.apk ./PROJECT_FRONTLINE_v0.3.0.apk
          ls -lh release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTLINE_v0.3.0-apk
          path: release-artifacts/PROJECT_FRONTLINE_v0.3.0.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.3.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Project Frontline ${{ steps.release_info.outputs.tag }} (Dummy War Edition)"
          body: |
            ## 🎮 Project Frontline v0.3.0 — Dummy War Update

            Большое обновление анимаций, физики и визуальных эффектов:

            ### 💥 Нововведения:
            - 🦾 **Анатомические солдаты-манекены (Dummy War):** Полностью подвижные тела бойцов с шарнирами (бёдра, колени, ступни, торс, плечи, локти, шея, голова и оружие).
            - 🏃 **Процедурная анимация бега:** Естественная шаговая походка с согнутыми коленями, покачиванием таза и тактической стойкой удержания оружия.
            - 🎯 **Физический Рэгдолл (Ragdoll) при гибели:** При смерти боты падают с импульсом от выстрела или взрыва — тела отлетают, суставы гнутся, шлемы срываются при попадании в голову!
            - 🩸 **Брызги и лужи крови:** Направленный фонтан брызг при попадании пули с образованием устойчивых пятен и луж крови на земле.
            - 💥 **Реакция на попадание (Flinch):** Бойцы вздрагивают и отклоняются от выстрелов.

            ### Инструкция по установке:
            1. Скачайте **`PROJECT_FRONTLINE_v0.3.0.apk`** ниже.
            2. Установите поверх предыдущей версии.
          files: |
            PROJECT_FRONTLINE_v0.3.0.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
