name: Build Android APK and Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/PROJECT_FRONTLINE_v0.2.1.apk
          cp release-artifacts/PROJECT_FRONTLINE_v0.2.1.apk release-artifacts/PROJECT_FRONTLINE_v0.2.apk
          cp release-artifacts/PROJECT_FRONTLINE_v0.2.1.apk ./PROJECT_FRONTLINE_v0.2.1.apk
          cp release-artifacts/PROJECT_FRONTLINE_v0.2.apk ./PROJECT_FRONTLINE_v0.2.apk
          ls -lh release-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTLINE_v0.2.1-apk
          path: release-artifacts/PROJECT_FRONTLINE_v0.2.1.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.2.1"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Project Frontline ${{ steps.release_info.outputs.tag }}"
          body: |
            ## 🎮 Project Frontline v0.2.1 (Android APK Fix)

            Готовый играбельный установочный файл APK для Android.

            ### Что исправлено в v0.2.1:
            - 🛠 **Устранён вылет при старте на Android / Samsung Galaxy:** Отключён конфликтный `LAYER_TYPE_HARDWARE` на WebView, приводивший к крашу GPU-процесса Chromium и закрытию приложения через 0.1 секунды.
            - 🛡 **Отказоустойчивость WebGL:** Безопасная инициализация `THREE.WebGLRenderer` с автоподбором контекста под мобильные GPU (Mali / Adreno).
            - 📱 **Стабильный полноэкранный режим:** Безопасное управление системными панелями через `WindowInsetsControllerCompat`.
            - 🔒 **Защита от падений:** Реализован перехватчик `onRenderProcessGone` и обработчик глобальных ошибок в JS.

            ### Инструкция по установке:
            1. Скачайте файл **`PROJECT_FRONTLINE_v0.2.1.apk`** ниже.
            2. Откройте файл на телефоне и подтвердите обновление/установку поверх старой версии.
            3. Запустите игру.
          files: |
            PROJECT_FRONTLINE_v0.2.1.apk
            PROJECT_FRONTLINE_v0.2.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
